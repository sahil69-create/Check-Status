    <script>
        // Determine API base URL dynamically based on environment.
        // - Localhost/Local IP: Use direct HTTP to the API.
        // - Production: Use relative path to proxy through vercel.json to avoid Mixed Content/CORS issues.
        const isLocal = window.location.hostname === "localhost" || 
                        window.location.hostname === "127.0.0.1" || 
                        window.location.hostname.startsWith("192.168.") || 
                        window.location.hostname.startsWith("10.") ||
                        window.location.protocol === "file:";

        const API_BASE = isLocal ? "http://api.gmp.jyyxt.online" : "";

        /* =========================================================
         * Custom modal — replaces every alert() in the app.
         * Types:  info | success | warning | error
         * =======================================================*/
        (function initModal() {
            const root   = document.getElementById("gmpModal");
            const card   = document.getElementById("gmpModalCard");
            const bg     = document.getElementById("gmpModalBackdrop");
            const okBtn  = document.getElementById("gmpModalOk");
            const title  = document.getElementById("gmpModalTitle");
            const body   = document.getElementById("gmpModalBody");
            const accent = document.getElementById("gmpModalAccent");
            const iconW  = document.getElementById("gmpModalIconWrap");
            const icon   = document.getElementById("gmpModalIcon");

            const presets = {
                info:    { bg: "bg-sky-500",     wrap: "bg-sky-50 text-sky-600",   icon: "ℹ", t: "Information" },
                success: { bg: "bg-emerald-500", wrap: "bg-emerald-50 text-emerald-600", icon: "✓", t: "Success" },
                warning: { bg: "bg-amber-500",   wrap: "bg-amber-50 text-amber-600",   icon: "!", t: "Warning" },
                error:   { bg: "bg-rose-500",    wrap: "bg-rose-50 text-rose-600",    icon: "×", t: "Error" },
            };

            function setPreset(type) {
                const p = presets[type] || presets.info;
                accent.setAttribute("class", "h-1.5 " + p.bg);
                iconW.setAttribute("class",
                    "shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold " + p.wrap);
                icon.textContent = p.icon;
                return p.t;
            }

            function open() {
                root.classList.remove("hidden");
                root.classList.add("flex");
                // Force reflow so transition runs
                void card.offsetWidth;
                card.classList.remove("scale-95", "opacity-0");
                card.classList.add("scale-100", "opacity-100");
                // Focus the OK button for accessibility
                setTimeout(() => okBtn && okBtn.focus(), 30);
            }
            function close() {
                card.classList.remove("scale-100", "opacity-100");
                card.classList.add("scale-95", "opacity-0");
                setTimeout(() => {
                    root.classList.add("hidden");
                    root.classList.remove("flex");
                }, 180);
            }

            function showModal(message, type, customTitle) {
                const defaultTitle = setPreset(type || "info");
                title.textContent = (customTitle && customTitle.trim()) ? customTitle : defaultTitle;
                body.textContent = (typeof message === "string") ? message : "";
                open();
            }

            // Expose globally
            window.showModal = showModal;

            // Close handlers
            okBtn && okBtn.addEventListener("click", close);
            bg && bg.addEventListener("click", close);
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && !root.classList.contains("hidden")) close();
            });
        })();

        function checkPremium() {
            let username = document.getElementById("account_username").value.trim();
            if (username === "") {
                showModal("Please enter a registered email address.", "warning");
                return;
            }

            console.log("Checking premium for:", username, "at base:", API_BASE || "(relative proxy)");

            $.ajax({
                type: 'GET',
                url: API_BASE + '/api/v3/users/is_premium/' + username,
                timeout: 10000,
                success: function(responseData, textStatus, jqXHR) {
                    console.log("Premium check success:", responseData);
                    if (responseData && responseData.data && responseData.data.premium) {
                        showModal(
                            "Premium account confirmed.\n\n" +
                            "O usuário é premium.",
                            "success",
                            "Premium Verified"
                        );
                    } else {
                        showModal(
                            "No active premium subscription found for this account.\n\n" +
                            "Não é premium.",
                            "warning",
                            "Not Premium"
                        );
                    }
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    console.error("Premium check error:", {
                        url: API_BASE + '/api/v3/users/is_premium/' + username,
                        status: jqXHR.status,
                        textStatus: textStatus,
                        error: errorThrown,
                        response: jqXHR.responseText
                    });

                    let errorMsg = "We couldn't complete this premium check right now.\n\n";
                    if (jqXHR.status === 0) {
                        errorMsg +=
                            "Network error — the API may be offline or unreachable from this network.\n\n" +
                            "If deployed on Vercel, ensure vercel.json is deployed.\n" +
                            "If hosted on GitHub Pages (HTTPS), direct HTTP calls to the API are blocked by the browser.";
                    } else if (jqXHR.status === 403) {
                        errorMsg +=
                            "Access forbidden (403). The API may be rejecting requests from this origin.";
                    } else {
                        errorMsg +=
                            "HTTP status: " + (jqXHR.status || "Unknown") +
                            " (" + textStatus + ")";
                    }
                    showModal(errorMsg, "error", "Premium Check Failed");
                }
            });
        }

        function checkOrder() {
            let orderNum = document.getElementById("order_id").value.trim();
            if (!orderNum.startsWith("GPA")) {
                showModal(
                    "Please enter a valid Order ID.\n\nOrder IDs must begin with 'GPA.' (e.g. GPA.1234-5678).",
                    "warning",
                    "Invalid Order ID"
                );
                return;
            }

            console.log("Checking order:", orderNum, "at base:", API_BASE || "(relative proxy)");

            $.ajax({
                type: 'GET',
                url: API_BASE + '/api/v3/orders/' + orderNum,
                timeout: 10000,
                success: function(responseData, textStatus, jqXHR) {
                    console.log("Order check success:", responseData);

                    // Safe access with defaults
                    const email  = responseData.userEmail               || "Unknown";
                    const days   = String(responseData.daysContain      || "0");
                    const expire = responseData.userSubscriptionExpireTime || "Unknown";
                    const date   = responseData.purchaseDate            || "Unknown";

                    let copied = false;
                    try {
                        if (responseData.userEmail) {
                            navigator.clipboard && navigator.clipboard.writeText(email);
                            copied = true;
                        }
                    } catch (e) {
                        console.warn("Clipboard copy failed:", e);
                    }

                    const body =
                        "Order ID:   " + orderNum + "\n" +
                        "Days:       " + days + " days premium\n" +
                        "Linked to:  " + email + "\n" +
                        "Expires:    " + expire + "\n" +
                        "Purchased:  " + date +
                        (copied ? "\n\nThe linked email has been copied to your clipboard." : "");

                    showModal(body, "success", "Order Details");

                    const emailBox = document.getElementById("user_email_text");
                    emailBox.innerHTML =
                      '<div class="text-[11px] uppercase tracking-wide text-gray-500 font-semibold mb-1">' +
                        'User email (copied to clipboard)' +
                      '</div>' +
                      '<div class="font-mono text-sm text-gray-900 break-all select-all bg-white rounded-md px-2.5 py-1.5 border border-gray-200">' +
                        email +
                      '</div>';
                    emailBox.classList.remove("hidden");
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    console.error("Order check error:", {
                        url: API_BASE + '/api/v3/orders/' + orderNum,
                        status: jqXHR.status,
                        textStatus: textStatus,
                        error: errorThrown,
                        response: jqXHR.responseText
                    });

                    if (jqXHR.status === 400) {
                        showModal(
                            "Order not found.\n\nThis order ID does not exist, or was placed before Feb 7, 2025.",
                            "warning",
                            "No Matching Order"
                        );
                    } else {
                        let errorMsg = "We couldn't load this order right now.\n\n";
                        if (jqXHR.status === 0) {
                            errorMsg +=
                                "Network error — the API may be offline or blocked from this network.";
                        } else {
                            errorMsg +=
                                "HTTP status: " + (jqXHR.status || "Unknown") +
                                " (" + textStatus + ")";
                        }
                        showModal(errorMsg, "error", "Order Lookup Failed");
                    }
                }
            });
        }

        // PASTE button functionality
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById("account_username").value = text;
            } catch (error) {
                showModal(
                    "We couldn't access your clipboard. Please paste the email manually using Ctrl+V.",
                    "info",
                    "Clipboard Unavailable"
                );
            }
        }
        async function pasteOrderFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById("order_id").value = text;
            } catch (error) {
                showModal(
                    "We couldn't access your clipboard. Please paste the order ID manually using Ctrl+V.",
                    "info",
                    "Clipboard Unavailable"
                );
            }
        }
        // CLEAR button functionality
        function clearInput() {
            document.getElementById("account_username").value = "";
        }

    </script>
